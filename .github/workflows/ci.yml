name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web and shared logic
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:credentials
      - run: npm test
      - run: npx playwright install chromium webkit --with-deps
      - run: npm run test:e2e
      - name: Preserve browser results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  ios:
    name: iOS simulator
    # macOS 27 fixes a StoreKit Test unknown-purchase error; keep the strict suite.
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Require macOS and Xcode 27
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          host = subprocess.check_output(['sw_vers', '-productVersion'], text=True).strip()
          print(f'macOS {host}')
          if host.split('.')[0] != '27':
              raise SystemExit('Native CI requires macOS 27 for the StoreKit Test service fixes.')
          version = subprocess.check_output(['xcodebuild', '-version'], text=True)
          print(version, end='')
          if not re.match(r'^Xcode 27(?:\.\d+)*(?:\s|$)', version):
              raise SystemExit('Native CI requires Xcode 27 from the selected app alias.')
          PY
      - name: Select iOS 27.0 simulator
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          runtimes = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'runtimes', '--json']))['runtimes']
          runtime = next((item for item in runtimes if item['isAvailable'] and item['name'].startswith('iOS ') and item['version'].split('.')[:2] == ['27', '0']), None)
          if runtime is None:
              raise SystemExit('Native CI requires an available iOS 27.0 simulator runtime.')
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))['devices']
          device = next((item for item in devices.get(runtime['identifier'], []) if item['name'] == 'iPhone 17 Pro'), None)
          if device is None:
              types = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devicetypes', '--json']))['devicetypes']
              device_type = next((item for item in types if item['name'] == 'iPhone 17 Pro'), None)
              if device_type is None:
                  raise SystemExit('Native CI requires the iPhone 17 Pro device type.')
              name = 'NookGrid CI iPhone 17 Pro'
              udid = subprocess.check_output(['xcrun', 'simctl', 'create', name, device_type['identifier'], runtime['identifier']], text=True).strip()
              device = {'name': name, 'udid': udid}
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write(f"NOOKGRID_SIMULATOR_ID={device['udid']}\n")
          print(f"Selected {runtime['name']} ({runtime['version']}), {device['name']}: {device['udid']}")
          PY
      - run: npm ci
      - run: npm run build:ios
      - run: npm run test:ios
      - name: Preserve local StoreKit diagnostic
        if: always()
        run: |
          if [ -n "${NOOKGRID_SIMULATOR_ID:-}" ]; then
            container="$(xcrun simctl get_app_container "$NOOKGRID_SIMULATOR_ID" com.nookgrid.app data 2>/dev/null || true)"
            if [ -n "$container" ] && [ -f "$container/tmp/NookGrid-StoreKit-Diagnostic.json" ]; then
              mkdir -p artifacts/ios
              cp "$container/tmp/NookGrid-StoreKit-Diagnostic.json" artifacts/ios/storekit-diagnostic.json
            fi
          fi
      - name: Package simulator app
        if: always()
        run: |
          if [ -d artifacts/ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app ]; then
            ditto -c -k --keepParent artifacts/ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app artifacts/ios/NookGrid-simulator.zip
          fi
      - name: Preserve native results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-simulator-results
          path: |
            artifacts/ios/NookGrid.xcresult
            artifacts/ios/NookGrid-simulator.zip
            artifacts/ios/storekit-diagnostic.json
            artifacts/ios/*.log
          if-no-files-found: ignore
          retention-days: 7
