name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web and shared logic
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install chromium webkit --with-deps
      - run: npm run test:e2e
      - name: Preserve browser results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  ios:
    name: iOS simulator
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: xcodebuild -version
      - name: Select iOS 26.4 simulator
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          runtimes = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'runtimes', '--json']))['runtimes']
          runtime = next(item for item in runtimes if item['isAvailable'] and item['name'].startswith('iOS ') and item['version'].split('.')[:2] == ['26', '4'])
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))['devices']
          device = next(item for item in devices[runtime['identifier']] if item['name'] == 'iPhone 17 Pro')
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write(f"NOOKGRID_SIMULATOR_ID={device['udid']}\n")
          print(f"Selected {runtime['name']} ({runtime['version']}), {device['name']}: {device['udid']}")
          PY
      - run: npm ci
      - run: npm run build:ios
      - run: npm run test:ios
      - name: Package simulator app
        if: always()
        run: |
          if [ -d artifacts/ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app ]; then
            ditto -c -k --keepParent artifacts/ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app artifacts/ios/NookGrid-simulator.zip
          fi
      - name: Preserve native results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-simulator-results
          path: |
            artifacts/ios/NookGrid.xcresult
            artifacts/ios/NookGrid-simulator.zip
            artifacts/ios/*.log
          if-no-files-found: ignore
          retention-days: 7
