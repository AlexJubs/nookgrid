name: Release web

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Current here.now version reviewed against this source
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: web-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: web-production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Publish public files and verify the owner manifest
        env:
          GH_TOKEN: ${{ github.token }}
          HERENOW_API_KEY: ${{ secrets.HERENOW_API_KEY }}
          HERENOW_SLUG: ${{ vars.HERENOW_SLUG }}
          HERENOW_ACCOUNT: ${{ vars.HERENOW_ACCOUNT }}
          HERENOW_BASE_VERSION: ${{ inputs.expected_version }}
        run: node scripts/release-web.mjs
