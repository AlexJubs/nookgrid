name: Release web

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_version:
        description: Current here.now version reviewed against this source
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: web-production
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.ENABLE_WEB_RELEASE == 'true')
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: web-production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Read the previous source for automatic release
        if: github.event_name == 'push'
        env:
          BASE_COMMIT: ${{ github.event.before }}
        run: |
          git fetch origin "$BASE_COMMIT" --depth=1
          mkdir -p "$RUNNER_TEMP/previous-source"
          git archive "$BASE_COMMIT" public | tar -x -C "$RUNNER_TEMP/previous-source"
          printf 'HERENOW_EXPECTED_DIRECTORY=%s\n' "$RUNNER_TEMP/previous-source/public" >> "$GITHUB_ENV"
      - name: Publish public files and verify the owner manifest
        env:
          HERENOW_API_KEY: ${{ secrets.HERENOW_API_KEY }}
          HERENOW_SLUG: ${{ vars.HERENOW_SLUG }}
          HERENOW_ACCOUNT: ${{ vars.HERENOW_ACCOUNT }}
          HERENOW_BASE_VERSION: ${{ inputs.expected_version }}
        run: node scripts/release-web.mjs
