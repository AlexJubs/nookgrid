name: Release TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.ENABLE_TESTFLIGHT_RELEASE == 'true')
    uses: ./.github/workflows/ci.yml

  upload:
    needs: checks
    runs-on: macos-15
    timeout-minutes: 30
    environment: ios-testflight
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      IOS_BUNDLE_ID: com.nookgrid.app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm run build:ios
        env:
          NOOKGRID_PRODUCTION: '1'
      - name: Install signing material
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          for name in APPLE_TEAM_ID IOS_BUNDLE_ID IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROFILE_BASE64 KEYCHAIN_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              printf 'Missing required signing setting: %s\n' "$name" >&2
              exit 1
            fi
          done
          umask 077
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP'])
          for name, filename in [('IOS_CERTIFICATE_BASE64', 'nookgrid.p12'), ('IOS_PROFILE_BASE64', 'nookgrid.mobileprovision')]:
              (temporary / filename).write_bytes(base64.b64decode(os.environ[name], validate=True))
          (temporary / 'AuthKey.p8').write_text(os.environ['ASC_PRIVATE_KEY'])
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/nookgrid.keychain-db"
          security set-keychain-settings -lut 3600 "$RUNNER_TEMP/nookgrid.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/nookgrid.keychain-db"
          security import "$RUNNER_TEMP/nookgrid.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/nookgrid.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/nookgrid.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/nookgrid.keychain-db"
          security cms -D -i "$RUNNER_TEMP/nookgrid.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          python3 - <<'PY'
          import datetime
          import os
          import plistlib
          import re
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP'])
          profile = plistlib.loads((temporary / 'profile.plist').read_bytes())
          team = os.environ['APPLE_TEAM_ID']
          bundle = os.environ['IOS_BUNDLE_ID']
          identifier = profile['UUID']
          assert re.fullmatch(r'[A-Fa-f0-9-]{36}', identifier), 'Invalid profile UUID'
          assert team in profile['TeamIdentifier'], 'Provisioning team does not match APPLE_TEAM_ID'
          assert profile['Entitlements']['application-identifier'] == f'{team}.{bundle}', 'Provisioning bundle ID does not match IOS_BUNDLE_ID'
          assert not profile['Entitlements'].get('get-task-allow'), 'Use an App Store distribution profile'
          assert not profile.get('ProvisionedDevices') and not profile.get('ProvisionsAllDevices'), 'Use an App Store distribution profile'
          assert profile['ExpirationDate'] > datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None), 'Provisioning profile expired'
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write(f'IOS_PROFILE_UUID={identifier}\n')
          options = {'method': 'app-store-connect', 'destination': 'upload', 'signingStyle': 'manual',
              'signingCertificate': 'Apple Distribution', 'teamID': team, 'provisioningProfiles': {bundle: identifier},
              'manageAppVersionAndBuildNumber': False, 'uploadSymbols': True}
          (temporary / 'ExportOptions.plist').write_bytes(plistlib.dumps(options))
          PY
          profile_id=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$RUNNER_TEMP/nookgrid.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$profile_id.mobileprovision"
      - name: Archive the signed app
        env:
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          xcodebuild archive -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/NookGrid.xcarchive" \
            -hideShellScriptEnvironment CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_UUID" \
            CODE_SIGN_IDENTITY='Apple Distribution' CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/NookGrid.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          printf 'Upload completed. Check App Store Connect processing and TestFlight availability.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Delete signing material
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/nookgrid.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/nookgrid.keychain-db"
          fi
          if [ -n "${IOS_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/nookgrid.p12" "$RUNNER_TEMP/nookgrid.mobileprovision" \
            "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/ExportOptions.plist"
