<body class="download-page">
  <main id="download-main" class="download-main">

    <p class="brand">NookGrid</p>
    <h1>Your daily brain game</h1>
    <p>Nine places. One neighborhood plan.<br>Play on iPhone and iPad.</p>
    <a id="download-store" class="primary inline-button" href="https://apps.apple.com/app/id6813274587" target="_blank" rel="noopener noreferrer">Download on the App Store</a>

  <template id="game-content">

    <div class="puzzle-heading"><h1><a class="brand" href="./" aria-label="NookGrid home" data-track="index-a-2">NookGrid</a></h1><p class="puzzle-meta sr-only"><span id="puzzle-label">Daily puzzle</span><span aria-hidden="true"> · </span><span id="puzzle-date">Loading…</span></p></div>
    <button class="icon-button" id="help-open" aria-label="How to play" aria-haspopup="dialog" aria-controls="help-dialog"><svg class="ui-icon" width="24" height="24" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20260924-calendar2#question"/></svg></button>
    <button class="icon-button" id="menu-open" aria-label="Menu" aria-haspopup="dialog"><svg class="ui-icon" width="24" height="24" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20260924-calendar2#list"/></svg></button>
  </header>
  <aside id="app-store-prompt" class="app-store-prompt" hidden aria-label="iPhone app"><a id="app-store-link" rel="noreferrer">Play NookGrid on iPhone</a><button id="app-store-dismiss" class="text-button" aria-label="Dismiss app suggestion"><svg class="ui-icon" width="24" height="24" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20260924-calendar2#x"/></svg></button></aside>
  <main>
    <h2 id="board-title" class="sr-only">Today's puzzle</h2>
    <div id="new-day" class="notice" hidden>A new neighborhood is ready. <a href="./" data-track="index-a-4">Play today's puzzle</a>. Your current board stays saved.</div>
    <p id="save-warning" class="notice" role="status" hidden><span>Progress can’t be saved in this browser. Keep this tab open.</span> <button class="text-button" id="retry-save">Retry save</button></p>
    <p id="load-status" class="empty-state" role="status">Loading the neighborhood…</p>
    <div id="load-error" class="empty-state" role="alert" hidden><h2>Couldn't load the puzzle</h2><p>Please try again.</p><a class="primary inline-button" href="" data-track="index-a-5">Try again</a></div>
    <noscript><p class="notice">NookGrid needs JavaScript to play. Enable it, then reload this page.</p></noscript>
    <section class="home-screen" id="home" aria-label="NookGrid home" hidden>
      <div class="home-intro"><h2 class="home-title">Your daily brain game</h2><p id="home-date"></p></div>
      <div class="home-progress">
        <div class="home-streak"><svg class="ui-icon" width="32" height="32" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20260925-streak#lightning"/></svg><strong class="streak-number" id="home-streak-count">0</strong><span class="streak-label">day streak</span></div>
        <div class="week-heading"><span>This week</span></div>
        <div class="week-strip" id="home-week" aria-label="This week's puzzles"></div>
      </div>
      <div class="home-actions">
        <button id="home-play" class="primary"><svg class="ui-icon" width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20260925-results#play-circle"/></svg><span id="home-play-label">Play today's puzzle</span></button>
        <button id="home-result" class="primary" hidden><svg class="ui-icon" width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20260925-results#eye"/></svg><span>View today's result</span></button>
        <button id="calendar-open" class="secondary calendar-button" aria-haspopup="dialog" aria-controls="calendar-dialog"><svg class="ui-icon" width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20260925-results#calendar-blank"/></svg><span>All puzzles</span></button>
        <button id="home-tutorial" class="secondary" type="button"><svg class="ui-icon" width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20260925-results#play-circle"/></svg><span>Play tutorial</span></button>
      </div>
    </section>
    <section class="game-layout" id="game" aria-label="Neighborhood puzzle" aria-busy="true" inert>
      <p class="puzzle-instruction sr-only">Arrange the places to match the plan.</p>
      <section class="clue-panel" id="clue-list" aria-labelledby="clues-title"><div class="clues-header"><h2 id="clues-title">Today’s plan</h2></div><details id="solved-plan" hidden><summary>Plan complete</summary></details><ol class="clues" id="clues" aria-label="Neighborhood plan"></ol></section>
      <div class="play-area">
        <div class="board-wrap"><div class="board" id="board" role="group" aria-label="Neighborhood lots, three rows and three columns"></div></div>
        <div class="play-controls"><div class="place-tray" id="tray" role="group" aria-label="Places to arrange"></div></div>
        <div class="play-controls">
          <div class="selection-bar"><p id="selection-status" role="status" class="sr-only">Drag a place, or tap a place then a square.</p></div>
          <div class="board-actions" role="group" aria-label="Puzzle actions">
            <button id="undo" class="text-button" disabled><svg class="ui-icon action-icon" width="24" height="24" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20260924-calendar2#arrow-u-up-left"/></svg><span>Undo</span></button>
            <button id="clear" class="text-button" disabled><svg class="ui-icon action-icon" width="24" height="24" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20260924-calendar2#arrow-counter-clockwise"/></svg><span>Reset</span></button>
            <button id="hint" class="text-button"><svg class="ui-icon action-icon" width="24" height="24" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20260924-calendar2#lightbulb"/></svg><span>Hint</span></button>
          </div>
        </div>
        <section class="completion" id="completion" hidden aria-labelledby="completion-title" tabindex="-1">
          <div class="completion-board" id="completion-board" aria-hidden="true"></div>
          <div class="completion-summary">
            <div><h2 id="completion-title">Neighborhood complete</h2><div class="completion-meta"><p id="daily-streak" class="streak-summary" hidden><svg class="ui-icon" width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20260925-streak#lightning"/></svg><span id="daily-streak-label"></span></p><p id="completion-time" hidden></p><p id="completion-detail">Plan complete.</p></div></div>
            <div class="result-history"><div class="week-heading"><span>This week</span></div><div class="week-strip" id="result-week" aria-label="This week's puzzles"></div></div>
            <div id="next-puzzle" hidden><span>Next puzzle in</span><strong id="next-puzzle-time" role="timer" aria-live="off">00:00:00</strong></div>
            <div class="completion-actions">
              <button class="primary" id="share"><svg class="ui-icon" width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20260925-results#share"/></svg><span>Share result</span></button>
              <a class="primary inline-button" id="play-today" href="./" hidden><svg class="ui-icon" width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20260925-results#play-circle"/></svg><span>Play today's puzzle</span></a>
              <button class="secondary" id="view-solved"><svg class="ui-icon" width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20260925-results#eye"/></svg><span>View solved puzzle</span></button>
              <button id="result-calendar-open" class="secondary calendar-button" aria-haspopup="dialog" aria-controls="calendar-dialog"><svg class="ui-icon" width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20260924-calendar2#calendar-blank"/></svg><span>All puzzles</span></button>
            </div>
            <p id="share-status" role="status"></p>
          </div>
        </section>
        <button class="secondary" id="view-result" hidden>Back to results</button>
      </div>
    </section>
  </main>

  <dialog id="help-dialog" aria-labelledby="help-title">
    <button class="close-dialog" data-close aria-label="Close how to play"><svg class="ui-icon" width="24" height="24" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20260924-calendar2#x"/></svg></button>
    <h2 id="help-title">How to play</h2>
    <p>Match all nine places to the neighborhood plan.</p>
    <p>A new puzzle arrives at 00:00 UTC each day.</p>
    <p>Drag a place, or tap it then a square. Occupied squares swap places. Drag a place back to the tray to remove it.</p>
    <div class="help-status"><span><span class="plan-status met"><svg class="ui-icon" width="24" height="24" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20260924-calendar2#check-square"/></svg></span> Fits this layout</span><span><span class="plan-status conflict"><svg class="ui-icon" width="24" height="24" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20260924-calendar2#x-square"/></svg></span> Needs a change</span></div>
    <dl class="help-terms"><dt>Directly left</dt><dd>One square left, same row.</dd><dt>Above</dt><dd>Anywhere higher, same column.</dd><dt>Touching</dt><dd>Sharing a side, never a diagonal.</dd></dl>
    <p class="help-note">A–C are rows; 1–3 are columns.</p>
    <div class="help-controls">
      <p><strong>Hints:</strong> Keep a place fixed, even after Reset. Each hint counts in your result. Completed puzzles are read-only.</p>
      <p class="help-note">Keyboard: Tab to move focus, Enter or Space to select, Delete or Backspace to remove a selected place, Escape to cancel.</p>
    </div>
    <nav class="help-links" aria-label="Tutorial help"><a id="help-tutorial" class="secondary inline-button" href="?date=practice">Play tutorial</a></nav>
  </dialog>

  <dialog id="menu-dialog" aria-labelledby="menu-title">
    <button class="close-dialog" data-close aria-label="Close menu" data-track="menu-close"><svg class="ui-icon" width="24" height="24" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20260924-calendar2#x"/></svg></button>
    <h2 id="menu-title">Menu</h2>
    <nav class="menu-links" aria-label="Game navigation">
      <button class="text-button" id="menu-calendar-open" aria-haspopup="dialog" aria-controls="calendar-dialog"><span>All puzzles</span><svg class="ui-icon menu-chevron" width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20260924-calendar2#caret-right"/></svg></button>
      <button class="text-button" id="settings-open" aria-haspopup="dialog"><span>Settings</span><svg class="ui-icon menu-chevron" width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20260924-calendar2#caret-right"/></svg></button>
      <button class="text-button" id="feedback-open" aria-haspopup="dialog"><span>Feedback</span><svg class="ui-icon menu-chevron" width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20260924-calendar2#caret-right"/></svg></button>
      <a href="./privacy.html" data-track="index-a-9"><span>Privacy</span><svg class="ui-icon menu-chevron" width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20260924-calendar2#caret-right"/></svg></a>
    </nav>
  </dialog>
  <dialog id="calendar-dialog" aria-labelledby="calendar-title">
    <button class="close-dialog" data-close aria-label="Close calendar"><svg class="ui-icon" width="24" height="24" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20260924-calendar2#x"/></svg></button>
    <div class="calendar-heading"><h2 id="calendar-title">All puzzles</h2><p id="calendar-streak" class="streak-summary"><svg class="ui-icon" width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20260925-streak#lightning"/></svg><span id="calendar-streak-label"></span></p></div>
    <p id="calendar-status" role="status">Loading puzzles…</p>
    <div id="calendar-navigation" class="calendar-navigation" hidden>
      <button id="calendar-previous" class="icon-button" aria-label="Previous month"><svg class="ui-icon" width="24" height="24" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20260924-calendar3#caret-right"/></svg></button>
      <h3 id="calendar-month-title" aria-live="polite" aria-atomic="true"></h3>
      <button id="calendar-next" class="icon-button" aria-label="Next month"><svg class="ui-icon" width="24" height="24" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20260924-calendar3#caret-right"/></svg></button>
    </div>
    <div id="calendar-months" aria-label="Puzzle completion history" hidden></div>
    <ul class="calendar-legend" aria-label="Calendar legend"><li><span class="calendar-swatch is-streak" aria-hidden="true"></span>Streak</li><li><span class="calendar-swatch is-completed" aria-hidden="true"></span>Completed</li><li><span class="calendar-swatch is-uncompleted" aria-hidden="true"></span>Uncompleted</li></ul>
  </dialog>
  <dialog id="share-dialog" aria-labelledby="share-title"><button class="close-dialog" data-close aria-label="Close share result" data-track="share-close"><svg class="ui-icon" width="24" height="24" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20260924-calendar2#x"/></svg></button><h2 id="share-title">Share your result</h2><p>Copy this result and send it to a friend.</p><label class="sr-only" for="share-text">Result text</label><textarea id="share-text" rows="7" readonly></textarea></dialog>
  <dialog id="hint-dialog" aria-labelledby="hint-title" aria-describedby="hint-description">
    <h2 id="hint-title">Reveal a place?</h2>
    <p id="hint-description">One place stays fixed until you solve, even after Reset. Adds 1 hint to your result.</p>
    <div class="hint-actions"><button class="secondary" data-close data-track="index-button-4" autofocus>Cancel</button><button class="primary" id="confirm-hint">Reveal</button></div>
  </dialog>
  <dialog id="feedback-dialog" aria-labelledby="feedback-title">
    <button class="close-dialog" data-close aria-label="Close feedback" data-track="index-button-7"><svg class="ui-icon" width="24" height="24" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20260924-calendar2#x"/></svg></button><h2 id="feedback-title">Feedback</h2>
    <p id="feedback-unavailable" class="notice">Feedback collection is temporarily unavailable. No feedback is being sent.</p>
    <form id="feedback-form" hidden><label class="sr-only" for="feedback-message">Your feedback</label><textarea id="feedback-message" name="message" maxlength="1000" rows="4" placeholder="Share your thoughts…" required autofocus></textarea><button type="submit" class="primary" id="feedback-send">Send</button></form>
    <p id="feedback-status" role="status"></p>
  </dialog>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <button class="close-dialog" data-close aria-label="Close settings" data-track="index-button-8"><svg class="ui-icon" width="24" height="24" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><use href="./icons.svg?v=20260924-calendar2#x"/></svg></button><h2 id="settings-title">Settings</h2>
    <div class="settings-section">
      <label class="setting-row" for="metrics-setting"><span>Play analytics</span><input type="checkbox" role="switch" class="setting-toggle" id="metrics-setting" aria-describedby="analytics-description privacy-signal"></label>
      <p id="analytics-description">Help improve the puzzles by measuring visits, moves and results without saving a tracking ID.</p>
      <p id="privacy-signal" role="status"></p>
    </div>
    <p class="settings-note">Your progress and streak stay in this browser. Clearing browser data removes them.</p>
  </dialog>
  </template>
